<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作业一 · 创意代码的基本原理 · 朱栩汕</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f1ea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        color: #2b2b2b;
      }
      .page { max-width: 640px; padding: 48px 24px; width: 100%; }
      .eyebrow {
        font-size: 13px; letter-spacing: 0.28em; color: #9a9a94; margin: 0 0 10px;
      }
      h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: 0.04em; }
      .intro { margin: 0 0 36px; color: #6f6a61; font-size: 15px; line-height: 1.7; }
      .works { display: grid; gap: 16px; }
      .work {
        display: block; padding: 22px 24px; background: #fff;
        border: 1px solid #e6e1d6; border-radius: 14px; text-decoration: none;
        color: inherit; transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .work:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(43,43,43,0.09); }
      .work-title { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
      .work-title .tag {
        display: inline-block; margin-left: 10px; padding: 2px 10px; border-radius: 999px;
        font-size: 12px; font-weight: 500; letter-spacing: 0.08em;
      }
      .tag-static { background: #e4572e; color: #fff; }
      .tag-dynamic { background: #17beb7; color: #fff; }
      .work-desc { margin: 0; font-size: 14px; color: #6f6a61; line-height: 1.7; }
      footer { margin-top: 40px; font-size: 13px; color: #9a9a94; }
      a.mail { color: inherit; }
    </style>
  </head>
  <body>
    <div class="page">
      <p class="eyebrow">互动编程 · 作业一</p>
      <h1>创意代码的基本原理</h1>
      <p class="intro">
        朱栩汕 · 数字媒体艺术 · 大二<br />
        两个 p5.js 作品：一个研究静态的图形构成，一个研究动态的交互行为。
      </p>

      <div class="works">
        <a class="work" href="static.html">
          <p class="work-title">静态构成 <span class="tag tag-static">STATIC</span></p>
          <p class="work-desc">
            圆与方块按网格交替排布，五色轮换、大小随行渐变。
            只用形状、颜色、位置，没有 draw() 循环。
          </p>
        </a>
        <a class="work" href="dynamic.html">
          <p class="work-title">运动轨迹 <span class="tag tag-dynamic">DYNAMIC</span></p>
          <p class="work-desc">
            清澈海面上，移动鼠标激起层层涟漪，按住拖动波纹更密。
            draw() 每帧运行，包含鼠标移动与按下两种交互。
          </p>
        </a>
      </div>

      <footer>
        <a class="mail" href="mailto:524408014@qq.com">524408014@qq.com</a>
      </footer>
    </div>
  </body>
</html>
